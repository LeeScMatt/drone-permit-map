<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f6feb">
<title>드론 비행 신청 지도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 14px; }
  body { display: flex; flex-direction: column; }
  #panel { background: #fff; border-bottom: 1px solid #ddd; padding: 8px; display: flex; flex-direction: column; gap: 6px; max-height: 45vh; overflow: auto; }
  #panel textarea { width: 100%; height: 80px; font-size: 12px; font-family: monospace; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button { padding: 7px 12px; cursor: pointer; }
  label { font-size: 12px; color: #555; }
  #status { font-size: 12px; color: #555; min-height: 16px; }
  #list { font-size: 12px; }
  .item { padding: 5px 4px; border-bottom: 1px solid #eee; cursor: pointer; }
  .item:hover { background: #eef5ff; }
  .item .fail { color: #c00; }
  #map { flex: 1; position: relative; min-height: 300px; }
  #footer { font-size: 11px; color: #777; padding: 4px 8px; background: #fafafa; border-top: 1px solid #eee; }
  #legendBtn { position: fixed; left: 10px; bottom: 36px; z-index: 1000; background: #333; color: #fff; border: 0; padding: 9px 14px; border-radius: 4px; font-size: 14px; }
  #legendPopup { position: fixed; right: 10px; bottom: 84px; z-index: 1000; background: #fff; padding: 10px; border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.3); width: 270px; max-height: 60vh; overflow-y: auto; }
  #legendPopup p { margin: 0; }
  #legendPopup .btns { display: flex; justify-content: space-between; margin-bottom: 8px; }
  #legendPopup label { display: block; padding: 3px 0; }
  .fbtn { position: fixed; z-index: 1000; background: #444; color: #fff; border: 0; padding: 9px 14px; border-radius: 4px; font-size: 14px; text-decoration: none; }
  #addrBtn { left: 10px; bottom: 90px; }
  #notamBtn { right: 10px; bottom: 36px; }
  #addrPopup { position: fixed; left: 10px; right: 10px; top: 10px; z-index: 1001; background: #fff; padding: 12px; border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  #addrPopup input { width: 100%; padding: 8px; font-size: 14px; }
  #addrPopup .btns { display: flex; gap: 6px; margin-top: 8px; }
  #addrMsg { font-size: 12px; color: #555; margin-top: 6px; }
  #recList { max-height: 220px; overflow-y: auto; border: 1px solid #eee; }
  #recBox textarea { width: 100%; height: 70px; font-size: 12px; font-family: monospace; }
  #recBox .row { margin: 4px 0; }
  #recList .addr { color: #555; }
</style>
</head>
<body>
<div id="panel">
  <div id="recBox">
    <label>드론원스톱 목록 표 붙여넣기 (북마클릿으로 복사한 내용, 머리글 포함)</label>
    <textarea id="listInput" placeholder="북마클릿으로 복사한 목록을 붙여넣으세요."></textarea>
    <div class="row">
      <label><input type="checkbox" id="onlyDone" checked> 처리완료만</label>
      <button id="listImport">목록 가져오기</button>
    </div>
    <div class="row">
      <select id="recFilter">
        <option value="all">전체</option>
        <option value="valid">유효기간 내</option>
        <option value="soon">만료 임박 (30일 이내)</option>
        <option value="expired">만료</option>
      </select>
      <button id="exportBtn">내보내기</button>
      <input type="file" id="importFile" accept=".json">
    </div>
    <div id="recList"></div>
  </div>
  <label>신청 구역 입력 (한 줄에 하나)<br>
    주소만: <code>경기도 여주시 강천면 강천리 645</code><br>
    좌표+반경: <code>37.2268, 127.7224, 300</code> (위도, 경도, 반경 m)
  </label>
  <textarea id="input" placeholder="여기에 구역을 한 줄씩 입력하세요."></textarea>
  <div class="row">
    <button id="run">지도에 표시</button>
    <button id="clear">지우기</button>
    <span id="status"></span>
  </div>
  <div id="list"></div>
</div>
<div id="map"></div>
<div id="footer">출처: 국토교통부 (공공데이터포털) 비행제한구역 · 배경지도: 브이월드. 참고용이며 실제 비행 전 공식 확인이 필요합니다.</div>
 
<button id="legendBtn">☰ 범례</button>
<div id="legendPopup" style="display:none">
  <div class="btns">
    <button id="toggleAll">전체 해제</button>
    <button id="closeLegend">닫기</button>
  </div>
  <div id="layerBox"></div>
</div>
<button id="addrBtn" class="fbtn">주소검색</button>
<a id="notamBtn" class="fbtn" href="http://aim.koca.go.kr/xNotam/?type=map" target="_blank" rel="noopener">항공고시보</a>
<div id="addrPopup" style="display:none">
  <input id="addrInput" placeholder="예: 경기도 여주시 강천면 강천리 645">
  <div class="btns">
    <button id="addrGo">검색</button>
    <button id="addrClose">닫기</button>
  </div>
  <div id="addrMsg"></div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js"></script>
<script>
// ===== 설정 =====
// 브이월드 API 인증키 (발급 시 등록한 서비스 URL과 현재 접속 주소가 같아야 합니다)
const VWORLD_KEY = "여기에_브이월드_인증키";
// 표시할 공역 레이어 목록 (WMS). on: 처음부터 켤지 여부
const RESTRICT_LAYERS = [
  { code: "lt_c_aisprhc", name: "비행금지구역", on: true },
  { code: "lt_c_aisresc", name: "비행제한구역", on: true },
  { code: "lt_c_aisctrc", name: "관제권", on: true },
  { code: "lt_c_aismoac", name: "군작전구역", on: true },
  { code: "lt_c_aisuac", name: "초경량비행장치공역", on: true },
  { code: "lt_c_aistemp", name: "임시비행금지공역", on: true },
  { code: "lt_c_aisdronezone", name: "드론시범사업구역", on: true },
  { code: "lt_c_aisaltc", name: "경계구역", on: true },
  { code: "lt_c_aisatzc", name: "비행장교통구역", on: true },
  { code: "lt_c_aisfldc", name: "경량항공기 이착륙장", on: true },
  { code: "lt_c_aisdngc", name: "위험지역", on: true },
  { code: "lt_c_aisobls", name: "장애물공역", on: true },
  { code: "lt_c_aispca", name: "사전협의구역", on: true },
  { code: "lt_c_uo301", name: "문화재보호도", on: true },
  { code: "lt_c_wgisnpgug", name: "국립자연공원", on: true }
];
 
const $ = id => document.getElementById(id);
const setStatus = t => { $("status").textContent = t; };
 
// ===== 지도 =====
const zoneSource = new ol.source.Vector();
const restrictLayers = RESTRICT_LAYERS.map(l => new ol.layer.Tile({
  source: new ol.source.TileWMS({
    url: "https://api.vworld.kr/req/wms",
    params: {
      LAYERS: l.code, STYLES: l.code, FORMAT: "image/png", TRANSPARENT: true,
      VERSION: "1.3.0", CRS: "EPSG:3857", key: VWORLD_KEY, domain: location.hostname
    }
  }),
  visible: l.on,
  opacity: 0.6
}));
 
const baseLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({
    url: `https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Base/{z}/{y}/{x}.png`,
    attributions: "© 브이월드"
  }),
  visible: true
});
const satLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({
    url: `https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Satellite/{z}/{y}/{x}.jpeg`,
    attributions: "© 브이월드"
  }),
  visible: false
});
// 위성 위에 도로/지명을 얹는 레이어
const hybridLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({
    url: `https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Hybrid/{z}/{y}/{x}.png`
  }),
  visible: false
});
 
const map = new ol.Map({
  target: "map",
  layers: [
    baseLayer,
    satLayer,
    hybridLayer,
    ...restrictLayers,
    new ol.layer.Vector({ source: zoneSource, style: new ol.style.Style({
      fill: new ol.style.Fill({ color: "rgba(31,111,235,0.25)" }),
      stroke: new ol.style.Stroke({ color: "#1f6feb", width: 2 }),
      image: new ol.style.Circle({ radius: 6, fill: new ol.style.Fill({ color: "#1f6feb" }), stroke: new ol.style.Stroke({ color: "#fff", width: 2 }) })
    }) })
  ],
  view: new ol.View({ center: ol.proj.fromLonLat([127.8, 36.5]), zoom: 7 })
});
 
// 구역 하나를 지도에 그림 (반경이 있으면 원, 없으면 점)
function drawZone(lon, lat, radius, label) {
  const center = [lon, lat];
  let feature;
  if (radius && radius > 0) {
    const poly = ol.geom.Polygon.circular(center, radius, 64).transform("EPSG:4326", "EPSG:3857");
    feature = new ol.Feature({ geometry: poly });
  } else {
    feature = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat(center)) });
  }
  feature.set("label", label);
  zoneSource.addFeature(feature);
  return feature;
}
 
// ===== 입력 파싱 & 주소 → 좌표 (브이월드 주소 검색) =====
function parseLine(line) {
  const nums = line.split(",").map(s => s.trim());
  if (nums.length >= 2 && !isNaN(nums[0]) && !isNaN(nums[1]) && nums[0] !== "" && nums[1] !== "") {
    return { lat: +nums[0], lon: +nums[1], radius: nums[2] ? +nums[2] : 0, addr: `${nums[0]}, ${nums[1]}` };
  }
  return { addr: line };
}
 
// JSONP: 스크립트 태그로 불러와 CORS 제한을 피함
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const name = "__vwcb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    const done = () => { delete window[name]; script.remove(); };
    window[name] = data => { done(); resolve(data); };
    script.onerror = () => { done(); reject(new Error("요청 실패")); };
    script.src = url + "&callback=" + name;
    document.head.appendChild(script);
  });
}
 
async function geocodeAddress(addr) {
  for (const type of ["ROAD", "PARCEL"]) {
    const url = `https://api.vworld.kr/req/address?service=address&request=getcoord&version=2.0&crs=epsg:4326` +
      `&address=${encodeURIComponent(addr)}&refine=true&simple=false&format=json&type=${type}&key=${VWORLD_KEY}`;
    try {
      const j = await jsonp(url);
      if (j.response && j.response.status === "OK") {
        const p = j.response.result.point;
        return { lon: +p.x, lat: +p.y };
      }
    } catch (e) { /* 다음 타입 시도 */ }
  }
  return null;
}
 
 
// ===== 레이어 체크박스 =====
function buildLayerBox() {
  const box = document.getElementById("layerBox");
  RESTRICT_LAYERS.forEach((l, i) => {
    const lab = document.createElement("label");
    lab.style.display = "block";
    lab.style.color = "#222";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = l.on;
    cb.onchange = () => restrictLayers[i].setVisible(cb.checked);
    lab.appendChild(cb);
    lab.append(" " + l.name);
    box.appendChild(lab);
  });
}
buildLayerBox();
 
// ===== 배경지도 전환 (일반/위성) =====
function buildBaseSwitch() {
  const box = document.getElementById("layerBox");
  const wrap = document.createElement("div");
  wrap.style.marginBottom = "6px";
  wrap.innerHTML = `<b style="color:#222">배경지도</b><br>` +
    `<label><input type="radio" name="base" value="base" checked> 일반</label> ` +
    `<label><input type="radio" name="base" value="sat"> 위성</label>`;
  box.prepend(wrap);
  wrap.querySelectorAll("input").forEach(r => r.onchange = () => {
    const sat = r.value === "sat";
    baseLayer.setVisible(!sat);
    satLayer.setVisible(sat);
    hybridLayer.setVisible(sat);
  });
}
buildBaseSwitch();
 
// 범례 팝업 열기/닫기, 전체 해제/선택
$("legendBtn").onclick = () => {
  const pop = $("legendPopup");
  pop.style.display = pop.style.display === "none" ? "block" : "none";
};
$("closeLegend").onclick = () => { $("legendPopup").style.display = "none"; };
let allOn = true;
$("toggleAll").onclick = () => {
  allOn = !allOn;
  document.querySelectorAll("#layerBox input[type=checkbox]").forEach((cb, i) => {
    cb.checked = allOn;
    restrictLayers[i].setVisible(allOn);
  });
  $("toggleAll").textContent = allOn ? "전체 해제" : "전체 선택";
};
 
// 주소검색: 입력한 주소로 지도 이동
$("addrBtn").onclick = () => { $("addrPopup").style.display = "block"; $("addrInput").focus(); };
$("addrClose").onclick = () => { $("addrPopup").style.display = "none"; };
async function doAddrSearch() {
  const q = $("addrInput").value.trim();
  if (!q) return;
  $("addrMsg").textContent = "검색 중...";
  const g = await geocodeAddress(q);
  if (!g) { $("addrMsg").textContent = "주소를 찾지 못했습니다."; return; }
  map.getView().animate({ center: ol.proj.fromLonLat([g.lon, g.lat]), zoom: 16, duration: 500 });
  $("addrMsg").textContent = "이동했습니다.";
}
$("addrGo").onclick = doAddrSearch;
$("addrInput").onkeydown = e => { if (e.key === "Enter") doAddrSearch(); };
 
// ===== 신청 목록 가져오기 / 기간 필터 =====
const REC_KEY = "drone-records-v1";
let records = [];
try { records = JSON.parse(localStorage.getItem(REC_KEY)) || []; } catch (e) { records = []; }
 
function saveRecords() {
  try { localStorage.setItem(REC_KEY, JSON.stringify(records)); }
  catch (e) { setStatus("브라우저 저장에 실패했습니다. 내보내기로 백업해 주세요."); }
}
 
// 신청일로부터 1년 뒤 날짜 (YYYY-MM-DD)
function addOneYear(d) {
  const [y, m, dd] = d.split("-");
  return `${Number(y) + 1}-${m}-${dd}`;
}
 
// 드론원스톱 목록 표(탭 구분) 읽기
function parseList(text) {
  const out = [];
  text.replace(/\r/g, "").split("\n").forEach(line => {
    const c = line.split("\t").map(x => x.trim());
    if (c.length < 5) return;
    const m = c[1].match(/^(\S+)\s*\(\s*(\d{4}-\d{2}-\d{2})\s*\)/);
    if (!m) return;
    const id = m[1], applied = m[2];
    const part = c[2].match(/\(\s*(\d+)\s*\/\s*(\d+)\s*\)/);
    const zone = c[2].match(/촬영구역:\s*(.*)$/);
    let addr = zone ? zone[1].trim() : "";
    let extra = 0;
    const ex = addr.match(/^(.*?)\s*외\s*(\d+)\s*구역$/);
    if (ex) { addr = ex[1].trim(); extra = Number(ex[2]); }
    out.push({
      key: id + (part ? `-${part[1]}of${part[2]}` : ""),
      id, applied, validTo: addOneYear(applied),
      part: part ? `${part[1]}/${part[2]}` : "",
      status: c[4], dept: c[3], addr, extra
    });
  });
  return out;
}
 
// 오늘 기준 유효기간 상태
function periodInfo(r) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const from = new Date(r.applied + "T00:00:00");
  const to = new Date(r.validTo + "T00:00:00");
  const left = Math.round((to - today) / 86400000);
  const active = today >= from && today <= to;
  let label;
  if (today < from) label = "신청 예정";
  else if (active) label = `유효 (D-${left})`;
  else label = "만료";
  return { label, left, active, expired: today > to };
}
 
function renderRecords() {
  const f = $("recFilter").value;
  const box = $("recList");
  box.innerHTML = "";
  const list = records.filter(r => {
    const p = periodInfo(r);
    if (f === "valid") return p.active;
    if (f === "soon") return p.active && p.left <= 30;
    if (f === "expired") return p.expired;
    return true;
  }).sort((a, b) => b.applied.localeCompare(a.applied) || a.key.localeCompare(b.key));
 
  list.forEach(r => {
    const p = periodInfo(r);
    const div = document.createElement("div");
    div.className = "item";
    const title = document.createElement("div");
    title.textContent = `${r.id}${r.part ? " (" + r.part + ")" : ""} · ${r.addr}${r.extra ? " 외 " + r.extra + "구역" : ""}`;
    const sub = document.createElement("span");
    sub.className = "addr";
    sub.textContent = `${r.applied} ~ ${r.validTo} · ${p.label}` + (r.extra ? " · 구역 표 복사 필요" : "");
    const del = document.createElement("button");
    del.textContent = "삭제";
    del.onclick = () => {
      records = records.filter(x => x.key !== r.key);
      saveRecords(); renderRecords();
    };
    div.append(title, sub, del);
    box.appendChild(div);
  });
  return list.length;
}
 
function mergeRecords(items, onlyDone) {
  let added = 0, updated = 0, skipped = 0;
  items.forEach(p => {
    if (onlyDone && p.status !== "처리완료") { skipped++; return; }
    const i = records.findIndex(r => r.key === p.key);
    if (i >= 0) { records[i] = { ...records[i], ...p }; updated++; }
    else { records.push(p); added++; }
  });
  saveRecords();
  return { added, updated, skipped };
}
 
$("listImport").onclick = () => {
  const parsed = parseList($("listInput").value);
  if (!parsed.length) return setStatus("읽을 행이 없습니다. 머리글을 포함해서 복사했는지 확인하세요.");
  const r = mergeRecords(parsed, $("onlyDone").checked);
  const shown = renderRecords();
  setStatus(`추가 ${r.added}건, 갱신 ${r.updated}건, 제외 ${r.skipped}건 (표시 ${shown}건)`);
};
 
$("recFilter").onchange = () => renderRecords();
 
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `drone-records-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
};
 
$("importFile").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const arr = JSON.parse(await f.text());
    const r = mergeRecords(arr, false);
    const shown = renderRecords();
    setStatus(`파일에서 ${arr.length}건 읽음 (추가 ${r.added}, 갱신 ${r.updated}, 표시 ${shown}건)`);
  } catch (err) {
    setStatus("파일 형식이 올바르지 않습니다.");
  }
  e.target.value = "";
};
 
renderRecords();
 
// ===== 실행 =====
$("run").onclick = async () => {
  const lines = $("input").value.split("\n").map(l => l.trim()).filter(Boolean);
  if (!lines.length) return setStatus("입력된 구역이 없습니다.");
  zoneSource.clear();
  $("list").innerHTML = "";
  let ok = 0, fail = 0;
  const extent = ol.extent.createEmpty();
 
  for (let i = 0; i < lines.length; i++) {
    const p = parseLine(lines[i]);
    setStatus(`처리 중... ${i + 1}/${lines.length}`);
    let lon = p.lon, lat = p.lat;
    if (lat === undefined) {
      const g = await geocodeAddress(p.addr);
      if (g) { lon = g.lon; lat = g.lat; }
    }
    const item = document.createElement("div");
    item.className = "item";
    item.textContent = `${i + 1}. ${p.addr}`;
    $("list").appendChild(item);
 
    if (lat === undefined || lon === undefined || isNaN(lat) || isNaN(lon)) {
      fail++;
      item.insertAdjacentHTML("beforeend", `<div class="fail">좌표를 찾지 못했습니다</div>`);
      continue;
    }
    ok++;
    const f = drawZone(lon, lat, p.radius, p.addr);
    ol.extent.extend(extent, f.getGeometry().getExtent());
    item.onclick = () => map.getView().fit(f.getGeometry().getExtent(), { maxZoom: 16, padding: [40, 40, 40, 40], duration: 400 });
  }
 
  if (ok) map.getView().fit(extent, { maxZoom: 16, padding: [40, 40, 40, 40] });
  setStatus(`완료: 표시 ${ok}건, 실패 ${fail}건`);
};
 
$("clear").onclick = () => { zoneSource.clear(); $("list").innerHTML = ""; setStatus(""); };
 
// 지도 이동이 끝나면 비행제한구역 다시 불러오기
</script>
